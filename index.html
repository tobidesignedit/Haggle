    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.configurable && !desc.writable && !desc.set) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
        } catch (_) {}

        function isExtensionError(msg, stack, filename) {
          var combined = String(msg || '') + ' ' + String(stack || '') + ' ' + String(filename || '');
          return (
            combined.indexOf('chrome-extension://') !== -1 ||
            combined.indexOf('moz-extension://') !== -1 ||
            combined.indexOf('Cannot set property fetch of #<Window>') !== -1 ||
            combined.indexOf('chrome: call method') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            var err = event && event.error;
            if (
              isExtensionError(
                event && event.message,
                err && err.stack,
                event && event.filename
              )
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = reason && (reason.message || String(reason));
            var stack = reason && reason.stack;
            if (isExtensionError(msg, stack, '')) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );
      })();
    </script>
    <title>Haggle — AI-Powered Bargaining Marketplace</title>
